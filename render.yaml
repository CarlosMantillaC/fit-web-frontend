services:
  - type: web
    name: fit-web-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NAME
        value: Fit Web
      - key: NODE_VERSION
        value: '22'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
